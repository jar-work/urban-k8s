# Trae el token del túnel desde GCP Secret Manager en vez de crearlo a mano.
# Depende de que external-secrets y el ClusterSecretStore "gcp-secret-manager"
# ya estén instalados (ver apps/external-secrets.yaml y
# apps/external-secrets-config.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-token
  namespace: cloudflare-tunnel
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-manager
    kind: ClusterSecretStore
  target:
    name: cloudflared-token
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef:
        key: cloudflared-tunnel-token-dev

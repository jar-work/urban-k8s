# CNPG PostgreSQL Clusters — dev
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-clusters
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:jar-work/urban-k8s.git
    targetRevision: main
    path: manifests/cnpg/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

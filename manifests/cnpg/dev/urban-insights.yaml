# Postgres de dev — sin backup a propósito (ver README.md de este directorio
# para qué falta armar cuando se necesite backup, primero en prod).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: urban-insights
  namespace: cnpg-system
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4
  storage:
    size: 5Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

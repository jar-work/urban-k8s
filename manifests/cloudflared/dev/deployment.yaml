apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
          envFrom:
            - secretRef:
                name: cloudflared-token
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
      volumes:
        - name: config
          configMap:
            name: cloudflared-config

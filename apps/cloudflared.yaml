# cloudflared - túnel de Cloudflare corriendo dentro del cluster, apuntado a Traefik
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:jar-work/urban-k8s.git
    targetRevision: main
    path: manifests/cloudflared/dev
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
